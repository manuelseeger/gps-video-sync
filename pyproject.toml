[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "gps-video-sync"
version = "1.0.0"
description = "Synchronize action camera telemetry with GPS tracks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/manuelseeger/gps-video-sync"
Documentation = "https://github.com/manuelseeger/gps-video-sync/blob/main/docs/reference.md"
Repository = "https://github.com/manuelseeger/gps-video-sync"
Issues = "https://github.com/manuelseeger/gps-video-sync/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
verify = ["matplotlib>=3.7"]

[project.scripts]
gps-video-sync = "gps_video_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses bundled GoPro media",
    "ffprobe: optional sample-table parity against ffprobe",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gps_video_sync"]

[tool.hatch.build.targets.sdist]
include = ["/src/gps_video_sync", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
