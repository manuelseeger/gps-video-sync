[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igc-video-sync"
version = "0.1.0"
description = "Synchronize action camera telemetry with GPS tracks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
verify = ["matplotlib>=3.7"]

[project.scripts]
igc-video-sync = "igc_video_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses bundled GoPro media",
    "ffprobe: optional sample-table parity against ffprobe",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igc_video_sync"]
