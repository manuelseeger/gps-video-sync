name: Release and publish

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      environment: ${{ steps.tag.outputs.environment }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main in the main repository
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REPOSITORY" = manuelseeger/gps-video-sync
          test "$REF_TYPE" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python scripts/release_tag.py "$REF_NAME" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Check package version against tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/check_release.py dist --version "$VERSION"
      - name: Create GitHub release with tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          # A retry must not replace files attached to an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/release-assets"
            gh release download "$TAG" --dir "$RUNNER_TEMP/release-assets"
            for archive in dist/*; do
              cmp "$archive" "$RUNNER_TEMP/release-assets/$(basename "$archive")"
            done
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"

  publish:
    needs: [validate, release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.environment }}
      url: ${{ needs.validate.outputs.prerelease == 'true' && 'https://test.pypi.org/p/gps-video-sync' || 'https://pypi.org/p/gps-video-sync' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.validate.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

  test-install:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Download the exact published wheel
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          INDEX: ${{ needs.validate.outputs.environment }}
        run: |
          python -m venv "$RUNNER_TEMP/published"
          export PATH="$RUNNER_TEMP/published/bin:$PATH"
          if [ "$INDEX" = testpypi ]; then
            index_url=https://test.pypi.org/simple/
          else
            index_url=https://pypi.org/simple/
          fi
          mkdir "$RUNNER_TEMP/download"
          for attempt in 1 2 3 4 5; do
            python -m pip download --no-deps --only-binary=:all: --index-url "$index_url" \
              --dest "$RUNNER_TEMP/download" "gps-video-sync==$VERSION" && break
            sleep 15
          done
          wheel=("$RUNNER_TEMP/download/"*.whl)
          test -f "${wheel[0]}"
      - name: Verify published archives before installation
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          INDEX: ${{ needs.validate.outputs.environment }}
        run: |
          cmp dist/*.whl "$RUNNER_TEMP/download/"*.whl
          for attempt in 1 2 3 4 5; do
            if python scripts/check_index.py dist --version "$VERSION" --index "$INDEX"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 15
          done
      - name: Test the installed package and verify extra outside the checkout
        run: |
          export PATH="$RUNNER_TEMP/published/bin:$PATH"
          wheel=("$RUNNER_TEMP/download/"*.whl)
          python -m pip install "${wheel[0]}"
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          python -m pip install "${wheel[0]}[verify]"
          python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --verify
